name: Jellyfin Plugin Release

on:
  release:
    types:
      - created
      - edited
      - released

permissions:
  contents: write
  deployments: write
  id-token: write
  pages: write

env:
  PLUGIN_GUID: 7e0e9030-598d-4709-814e-6a91dfed26f0
  PLUGIN_NAME: Bangumi for 10.10
  PLUGIN_OWNER: TGRonin
  PLUGIN_OVERVIEW: bgm.tv metadata provider for Jellyfin
  PLUGIN_DESCRIPTION: Jellyfin bgm.tv 数据源插件，用于拉取中文番剧信息及图片。
  TARGET_ABI: 10.9.0.0
  BASE_URL: https://tgronin.github.io/jellyfin-plugin-bangumi

jobs:
  build:
    name: Build Release Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Patch version
        env:
          TAG: ${{ github.ref_name }}
        run: sed -i "/Version/s/>.*</>${TAG#v}.0</" Directory.Build.props
      - name: Setup .NET 8.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8
      - name: Restore NuGet Packages
        run: dotnet restore
      - name: .NET Publish
        run: dotnet publish --configuration Release --output publish Jellyfin.Plugin.Bangumi
      - name: Generate Jellyfin Plugin Metadata
        shell: pwsh
        env:
          CHANGELOG: ${{ github.event.release.body }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = ($env:TAG -replace '^v', '') + '.0'
          @{
              category = "Metadata"
              changelog = $env:CHANGELOG
              description = $env:PLUGIN_DESCRIPTION
              guid = $env:PLUGIN_GUID
              name = $env:PLUGIN_NAME
              overview = $env:PLUGIN_OVERVIEW
              owner = $env:PLUGIN_OWNER
              targetAbi = $env:TARGET_ABI
              timestamp = Get-Date -AsUTC -Format s
              version = $version
          } | ConvertTo-Json -Compress | Out-File "publish/meta.json" -Encoding utf8NoBOM -NoNewline
      - name: Create Release Artifact
        run: zip -9j Jellyfin.Plugin.Bangumi.zip publish/*.dll publish/meta.json
      - uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.Bangumi
          path: Jellyfin.Plugin.Bangumi.zip
      - name: .NET Publish (Emby)
        run: dotnet publish --configuration Release --output publish Emby.Plugin.Bangumi
      - uses: actions/upload-artifact@v4
        with:
          name: Emby.Plugin.Bangumi
          path: publish/Emby.Plugin.Bangumi.dll
  upload:
    name: Upload to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Jellyfin.Plugin.Bangumi
      - uses: actions/download-artifact@v4
        with:
          name: Emby.Plugin.Bangumi
      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: "${{ github.token }}"
          tag: ${{ github.ref_name }}
          overwrite: true
          file_glob: true
          file: "*.Plugin.Bangumi.{dll,zip}"
  repository:
    name: Update Plugin Repository
    runs-on: ubuntu-latest
    needs: upload
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Jellyfin.Plugin.Bangumi
      - name: Create Plugin Repository for Jellyfin
        shell: pwsh
        env:
          CHANGELOG: ${{ github.event.release.body }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = ($env:TAG -replace '^v', '') + '.0'
          New-Item -ItemType Directory -Force -Path Release | Out-Null

          $existing = $null
          try {
            $existing = (Invoke-WebRequest -Uri "$env:BASE_URL/repository.json").Content | ConvertFrom-Json
            Write-Host "loaded existing repository.json with $($existing[0].versions.Count) version(s)"
          } catch {
            Write-Host "no published repository.json yet, starting a fresh one"
          }

          $versions = @()
          if ($existing) {
            $versions = @($existing[0].versions | Where-Object { $_.version -ne $Version })
          }

          Copy-Item 'Jellyfin.Plugin.Bangumi.zip' "Release/$Version.zip" -Force

          $imageUrl = $null
          if (Test-Path 'poster.png') {
            Copy-Item 'poster.png' 'Release/poster.png' -Force
            $imageUrl = "$env:BASE_URL/poster.png"
          }

          $entry = [ordered]@{
            version = $Version
            sourceUrl = "$env:BASE_URL/$Version.zip"
            changelog = $env:CHANGELOG
            targetAbi = $env:TARGET_ABI
            checksum = (Get-FileHash -Algorithm MD5 'Jellyfin.Plugin.Bangumi.zip').Hash.ToLower()
            timestamp = Get-Date -AsUTC -Format s
          }
          if ($imageUrl) { $entry.imageUrl = $imageUrl }

          $versions = @($entry) + $versions

          foreach ($v in $versions) {
            if ($v.version -eq $Version) { continue }
            $dest = "Release/$($v.version).zip"
            if (Test-Path $dest) { continue }
            try {
              Invoke-WebRequest -Uri $v.sourceUrl -OutFile $dest
            } catch {
              Write-Warning "could not fetch previous release $($v.version) from $($v.sourceUrl)"
            }
          }

          $plugin = [ordered]@{
            category = 'Metadata'
            guid = $env:PLUGIN_GUID
            name = $env:PLUGIN_NAME
            overview = $env:PLUGIN_OVERVIEW
            description = $env:PLUGIN_DESCRIPTION
            owner = $env:PLUGIN_OWNER
            versions = $versions
          }
          if ($imageUrl) { $plugin.imageUrl = $imageUrl }

          ConvertTo-Json @($plugin) -Compress -Depth 6 | Out-File 'Release/repository.json' -Encoding utf8NoBOM -NoNewline
      - name: Generate GitHub Pages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-repository
          path: Release/*
          retention-days: 1
  deploy-github-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: repository
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-repository
          path: pages
      - name: Repack Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
