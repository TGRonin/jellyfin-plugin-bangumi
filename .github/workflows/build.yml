name: 'Bangumi Plugin'

on:
  push:
    branches-ignore:
      - release
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build and Test Plugin
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve MetaData
        id: meta
        run: |
          BASE_TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo v1.1.0)
          DISTANCE=$(git rev-list --count "$BASE_TAG"..HEAD)
          echo "Resolved base tag $BASE_TAG, distance $DISTANCE"
          echo "version=${BASE_TAG#v}.$DISTANCE" >> "$GITHUB_OUTPUT"
      - name: Patch version
        run: sed -i "/Version/s/>.*</>${{ steps.meta.outputs.version }}</" Directory.Build.props
      - name: Setup .NET 8.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8
      - name: Restore NuGet Packages
        run: dotnet restore
      - name: .NET Test
        id: dotnet-test
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet test --configuration Release Jellyfin.Plugin.Bangumi.Test 2>&1 | tee /tmp/dotnet-test.log
      - name: Surface test log to job summary
        if: steps.dotnet-test.outcome == 'failure'
        run: |
          {
            echo '## .NET Test failed'
            echo ''
            echo '```'
            tail -n 250 /tmp/dotnet-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Raw logs and the job summary both require sign-in; check-run
          # annotations are the only failure detail readable anonymously.
          grep -E "error CS|Missing Bangumi API fixture|Assert\.|Error Message|Failed!|Passed!|Skipped " /tmp/dotnet-test.log \
            | head -n 80 \
            | while IFS= read -r line; do
                printf '::error::%s\n' "${line//'%'/'%25'}"
              done
      - name: .NET Publish
        run: dotnet publish --configuration Release --output publish Jellyfin.Plugin.Bangumi
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin
          path: publish/*.dll
      - name: .NET Publish (Emby)
        run: |
          rm -rf publish
          dotnet publish --configuration Release --output publish Emby.Plugin.Bangumi
      - uses: actions/upload-artifact@v4
        with:
          name: emby-plugin
          path: publish/*.dll
  release:
    name: Upload to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == 'master'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jellyfin-plugin
          path: jellyfin
      - uses: actions/download-artifact@v4
        with:
          name: emby-plugin
          path: emby
      - name: Generate Jellyfin Plugin Metadata
        shell: pwsh
        run: |
          @{
              category = "Metadata"
              changelog = ""
              description = "Jellyfin bgm.tv 数据源插件，用于拉取中文番剧信息及图片。"
              guid = "7e0e9030-598d-4709-814e-6a91dfed26f0"
              name = "Bangumi for 10.10"
              overview = "bgm.tv metadata provider for Jellyfin"
              owner = "TGRonin"
              targetAbi = "10.9.0.0"
              timestamp = Get-Date -AsUTC -Format s
              version = "${{ needs.build.outputs.version }}"
          } | ConvertTo-Json -Compress | Out-File "jellyfin/meta.json" -Encoding UTF8 -NoNewline
      - name: Pack Jellyfin Plugin
        run: zip -9j Jellyfin.Plugin.Bangumi.zip jellyfin/*.dll jellyfin/meta.json
      - name: Copy DLLs
        run: |
          cp jellyfin/Jellyfin.Plugin.Bangumi.dll .
          cp emby/Emby.Plugin.Bangumi.dll .
      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: "${{ github.token }}"
          tag: ci
          prerelease: true
          overwrite: true
          file_glob: true
          file: "*.Plugin.Bangumi.{dll,zip}"
